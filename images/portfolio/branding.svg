<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Abstract brand elements -->
  <g opacity="0.8">
    <!-- Circular brand element -->
    <circle cx="300" cy="200" r="120" fill="none" stroke="#9d4edd" stroke-width="3" />
    <circle cx="300" cy="200" r="100" fill="none" stroke="#ff2a6d" stroke-width="2" stroke-dasharray="10 5" />
    <circle cx="300" cy="200" r="80" fill="none" stroke="#00eeff" stroke-width="1" />
    
    <!-- Brand mark -->
    <g transform="translate(300, 200)">
      <!-- Abstract logo shape -->
      <path d="M-40,-40 L40,-40 L0,40 Z" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="0" cy="0" r="10" fill="#00eeff" />
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#ff2a6d" stroke-width="2" />
    </g>
  </g>
  
  <!-- Brand elements -->
  <g>
    <!-- Color palette circles -->
    <circle cx="150" cy="100" r="20" fill="#00eeff" />
    <circle cx="200" cy="100" r="20" fill="#9d4edd" />
    <circle cx="250" cy="100" r="20" fill="#ff2a6d" />
    <circle cx="300" cy="100" r="20" fill="#ffffff" />
    <circle cx="350" cy="100" r="20" fill="#121212" stroke="#ffffff" stroke-width="1" />
    
    <!-- Typography elements -->
    <g transform="translate(150, 320)">
      <text x="0" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#ffffff" font-weight="bold">Aa</text>
      <text x="50" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#ffffff">Bb</text>
      <text x="100" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#ffffff" font-style="italic">Cc</text>
      <text x="150" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#00eeff">Dd</text>
      <text x="200" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#9d4edd">Ee</text>
      <text x="250" y="0" font-family="'Arial', sans-serif" font-size="24" fill="#ff2a6d">Ff</text>
    </g>
    
    <!-- Design elements -->
    <rect x="450" y="150" width="40" height="40" fill="#00eeff" opacity="0.8" />
    <circle cx="470" cy="230" r="20" fill="#9d4edd" opacity="0.8" />
    <path d="M450,270 L490,270 L470,310 Z" fill="#ff2a6d" opacity="0.8" />
    
    <!-- Grid lines -->
    <g stroke="#ffffff" stroke-width="0.5" opacity="0.2">
      <line x1="100" y1="150" x2="400" y2="150" />
      <line x1="100" y1="200" x2="400" y2="200" />
      <line x1="100" y1="250" x2="400" y2="250" />
      
      <line x1="150" y1="150" x2="150" y2="250" />
      <line x1="200" y1="150" x2="200" y2="250" />
      <line x1="250" y1="150" x2="250" y2="250" />
      <line x1="300" y1="150" x2="300" y2="250" />
      <line x1="350" y1="150" x2="350" y2="250" />
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">BRAND IDENTITY</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#00eeff" text-anchor="middle">VISUAL DESIGN SYSTEM</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="180" fill="url(#brandGlow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="brandGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>