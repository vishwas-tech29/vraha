<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Motion graphics elements -->
  <g opacity="0.8">
    <!-- Video timeline -->
    <rect x="100" y="300" width="400" height="30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    
    <!-- Timeline markers -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.5">
      <line x1="150" y1="295" x2="150" y2="335" />
      <line x1="200" y1="295" x2="200" y2="335" />
      <line x1="250" y1="295" x2="250" y2="335" />
      <line x1="300" y1="295" x2="300" y2="335" />
      <line x1="350" y1="295" x2="350" y2="335" />
      <line x1="400" y1="295" x2="400" y2="335" />
      <line x1="450" y1="295" x2="450" y2="335" />
    </g>
    
    <!-- Playhead -->
    <g>
      <line x1="300" y1="280" x2="300" y2="350" stroke="#ff2a6d" stroke-width="2" />
      <polygon points="300,275 295,285 305,285" fill="#ff2a6d" />
    </g>
    
    <!-- Video clips on timeline -->
    <rect x="100" y="305" width="80" height="20" fill="#00eeff" opacity="0.8" />
    <rect x="180" y="305" width="120" height="20" fill="#9d4edd" opacity="0.8" />
    <rect x="300" y="305" width="100" height="20" fill="#ff2a6d" opacity="0.8" />
    <rect x="400" y="305" width="60" height="20" fill="#00eeff" opacity="0.8" />
  </g>
  
  <!-- Motion graphics visualization -->
  <g>
    <!-- Video frame -->
    <rect x="150" y="100" width="300" height="170" fill="none" stroke="#ffffff" stroke-width="2" />
    
    <!-- Abstract motion elements inside frame -->
    <g clip-path="url(#frameClip)">
      <!-- Motion paths -->
      <path d="M150,185 C200,120 250,250 300,185 C350,120 400,250 450,185" fill="none" stroke="#00eeff" stroke-width="3" opacity="0.8" />
      
      <!-- Motion objects -->
      <circle cx="200" cy="150" r="15" fill="#9d4edd" opacity="0.8" />
      <rect x="250" y="170" width="30" height="30" fill="#ff2a6d" opacity="0.8" />
      <polygon points="350,150 370,180 330,180" fill="#00eeff" opacity="0.8" />
      
      <!-- Motion blur effects -->
      <g opacity="0.4">
        <circle cx="200" cy="150" r="20" fill="#9d4edd" />
        <circle cx="200" cy="150" r="25" fill="#9d4edd" opacity="0.3" />
        
        <rect x="245" y="165" width="40" height="40" fill="#ff2a6d" opacity="0.3" />
        
        <polygon points="350,145 375,185 325,185" fill="#00eeff" opacity="0.3" />
      </g>
      
      <!-- Keyframe indicators -->
      <circle cx="200" cy="150" r="5" fill="#ffffff" />
      <circle cx="265" cy="185" r="5" fill="#ffffff" />
      <circle cx="350" cy="150" r="5" fill="#ffffff" />
    </g>
    
    <!-- Frame overlay grid -->
    <g stroke="#ffffff" stroke-width="0.5" opacity="0.2">
      <line x1="150" y1="135" x2="450" y2="135" />
      <line x1="150" y1="170" x2="450" y2="170" />
      <line x1="150" y1="205" x2="450" y2="205" />
      
      <line x1="200" y1="100" x2="200" y2="270" />
      <line x1="250" y1="100" x2="250" y2="270" />
      <line x1="300" y1="100" x2="300" y2="270" />
      <line x1="350" y1="100" x2="350" y2="270" />
      <line x1="400" y1="100" x2="400" y2="270" />
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">MOTION GRAPHICS</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#00eeff" text-anchor="middle">B-ROLL & ANIMATION</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="185" r="150" fill="url(#motionGlow)" opacity="0.15" />
  
  <!-- Definitions -->
  <defs>
    <!-- Clip path for video frame -->
    <clipPath id="frameClip">
      <rect x="150" y="100" width="300" height="170" />
    </clipPath>
    
    <!-- Gradient for glow effect -->
    <radialGradient id="motionGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff2a6d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>