<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Abstract city grid -->
  <g opacity="0.8">
    <!-- Horizontal lines -->
    <g stroke="#00eeff" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="50" x2="600" y2="50" />
      <line x1="0" y1="100" x2="600" y2="100" />
      <line x1="0" y1="150" x2="600" y2="150" />
      <line x1="0" y1="200" x2="600" y2="200" />
      <line x1="0" y1="250" x2="600" y2="250" />
      <line x1="0" y1="300" x2="600" y2="300" />
      <line x1="0" y1="350" x2="600" y2="350" />
    </g>
    
    <!-- Vertical lines -->
    <g stroke="#00eeff" stroke-width="0.5" opacity="0.3">
      <line x1="50" y1="0" x2="50" y2="400" />
      <line x1="100" y1="0" x2="100" y2="400" />
      <line x1="150" y1="0" x2="150" y2="400" />
      <line x1="200" y1="0" x2="200" y2="400" />
      <line x1="250" y1="0" x2="250" y2="400" />
      <line x1="300" y1="0" x2="300" y2="400" />
      <line x1="350" y1="0" x2="350" y2="400" />
      <line x1="400" y1="0" x2="400" y2="400" />
      <line x1="450" y1="0" x2="450" y2="400" />
      <line x1="500" y1="0" x2="500" y2="400" />
      <line x1="550" y1="0" x2="550" y2="400" />
    </g>
  </g>
  
  <!-- City buildings -->
  <g>
    <!-- Tall building 1 -->
    <rect x="100" y="100" width="40" height="300" fill="none" stroke="#9d4edd" stroke-width="2" opacity="0.8" />
    <g fill="#9d4edd" opacity="0.5">
      <rect x="110" y="120" width="5" height="10" />
      <rect x="125" y="120" width="5" height="10" />
      <rect x="110" y="140" width="5" height="10" />
      <rect x="125" y="140" width="5" height="10" />
      <rect x="110" y="160" width="5" height="10" />
      <rect x="125" y="160" width="5" height="10" />
      <rect x="110" y="180" width="5" height="10" />
      <rect x="125" y="180" width="5" height="10" />
      <rect x="110" y="200" width="5" height="10" />
      <rect x="125" y="200" width="5" height="10" />
      <rect x="110" y="220" width="5" height="10" />
      <rect x="125" y="220" width="5" height="10" />
      <rect x="110" y="240" width="5" height="10" />
      <rect x="125" y="240" width="5" height="10" />
    </g>
    
    <!-- Tall building 2 -->
    <rect x="200" y="150" width="60" height="250" fill="none" stroke="#ff2a6d" stroke-width="2" opacity="0.8" />
    <g fill="#ff2a6d" opacity="0.5">
      <rect x="210" y="170" width="10" height="15" />
      <rect x="230" y="170" width="10" height="15" />
      <rect x="210" y="195" width="10" height="15" />
      <rect x="230" y="195" width="10" height="15" />
      <rect x="210" y="220" width="10" height="15" />
      <rect x="230" y="220" width="10" height="15" />
      <rect x="210" y="245" width="10" height="15" />
      <rect x="230" y="245" width="10" height="15" />
      <rect x="210" y="270" width="10" height="15" />
      <rect x="230" y="270" width="10" height="15" />
    </g>
    
    <!-- Futuristic tower -->
    <path d="M350,50 L380,50 L390,400 L340,400 Z" fill="none" stroke="#00eeff" stroke-width="2" opacity="0.8" />
    <g fill="#00eeff" opacity="0.5">
      <rect x="355" y="80" width="20" height="5" />
      <rect x="355" y="95" width="20" height="5" />
      <rect x="355" y="110" width="20" height="5" />
      <rect x="355" y="125" width="20" height="5" />
      <rect x="355" y="140" width="20" height="5" />
      <rect x="355" y="155" width="20" height="5" />
      <rect x="355" y="170" width="20" height="5" />
      <rect x="355" y="185" width="20" height="5" />
      <rect x="355" y="200" width="20" height="5" />
      <rect x="355" y="215" width="20" height="5" />
      <rect x="355" y="230" width="20" height="5" />
    </g>
    
    <!-- Dome structure -->
    <path d="M450,200 Q500,100 550,200" fill="none" stroke="#9d4edd" stroke-width="2" />
    <line x1="450" y1="200" x2="450" y2="400" stroke="#9d4edd" stroke-width="2" />
    <line x1="550" y1="200" x2="550" y2="400" stroke="#9d4edd" stroke-width="2" />
    <path d="M450,400 L550,400" stroke="#9d4edd" stroke-width="2" />
    
    <!-- Windows for dome structure -->
    <g fill="#9d4edd" opacity="0.5">
      <rect x="470" y="220" width="10" height="20" />
      <rect x="490" y="220" width="10" height="20" />
      <rect x="510" y="220" width="10" height="20" />
      <rect x="530" y="220" width="10" height="20" />
      
      <rect x="470" y="250" width="10" height="20" />
      <rect x="490" y="250" width="10" height="20" />
      <rect x="510" y="250" width="10" height="20" />
      <rect x="530" y="250" width="10" height="20" />
      
      <rect x="470" y="280" width="10" height="20" />
      <rect x="490" y="280" width="10" height="20" />
      <rect x="510" y="280" width="10" height="20" />
      <rect x="530" y="280" width="10" height="20" />
    </g>
  </g>
  
  <!-- Perpexcity Logo/Text -->
  <g transform="translate(300, 80)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="bold">PERPEXCITY</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#00eeff" text-anchor="middle">FUTURE LIVING REDEFINED</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="200" fill="url(#cityGlow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="cityGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00eeff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>