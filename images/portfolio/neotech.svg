<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Abstract tech pattern -->
  <g opacity="0.6">
    <!-- Grid lines -->
    <g stroke="#9d4edd" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="50" x2="600" y2="50" />
      <line x1="0" y1="100" x2="600" y2="100" />
      <line x1="0" y1="150" x2="600" y2="150" />
      <line x1="0" y1="200" x2="600" y2="200" />
      <line x1="0" y1="250" x2="600" y2="250" />
      <line x1="0" y1="300" x2="600" y2="300" />
      <line x1="0" y1="350" x2="600" y2="350" />
      
      <line x1="50" y1="0" x2="50" y2="400" />
      <line x1="100" y1="0" x2="100" y2="400" />
      <line x1="150" y1="0" x2="150" y2="400" />
      <line x1="200" y1="0" x2="200" y2="400" />
      <line x1="250" y1="0" x2="250" y2="400" />
      <line x1="300" y1="0" x2="300" y2="400" />
      <line x1="350" y1="0" x2="350" y2="400" />
      <line x1="400" y1="0" x2="400" y2="400" />
      <line x1="450" y1="0" x2="450" y2="400" />
      <line x1="500" y1="0" x2="500" y2="400" />
      <line x1="550" y1="0" x2="550" y2="400" />
    </g>
  </g>
  
  <!-- NeoTech Logo -->
  <g transform="translate(300, 200)">
    <!-- Abstract tech logo -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#9d4edd" stroke-width="3" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ff2a6d" stroke-width="2" />
    
    <!-- N letter stylized -->
    <path d="M-30,-30 L-30,30 L30,-30 L30,30" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tech elements -->
    <circle cx="-30" cy="-30" r="5" fill="#00eeff" />
    <circle cx="30" cy="-30" r="5" fill="#00eeff" />
    <circle cx="-30" cy="30" r="5" fill="#00eeff" />
    <circle cx="30" cy="30" r="5" fill="#00eeff" />
  </g>
  
  <!-- Brand elements -->
  <g>
    <!-- Color palette -->
    <rect x="100" y="320" width="30" height="30" fill="#9d4edd" />
    <rect x="140" y="320" width="30" height="30" fill="#ff2a6d" />
    <rect x="180" y="320" width="30" height="30" fill="#00eeff" />
    <rect x="220" y="320" width="30" height="30" fill="#ffffff" />
    
    <!-- Typography sample -->
    <text x="300" y="330" font-family="'Arial', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NEOTECH SANS</text>
    <text x="300" y="350" font-family="'Arial', sans-serif" font-size="12" fill="#9d4edd" text-anchor="middle">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text>
    
    <!-- Brand patterns -->
    <g transform="translate(450, 330)">
      <circle cx="0" cy="0" r="10" fill="#9d4edd" />
      <circle cx="25" cy="0" r="10" fill="#ff2a6d" />
      <circle cx="50" cy="0" r="10" fill="#00eeff" />
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">NEOTECH</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#9d4edd" text-anchor="middle">BRAND IDENTITY SYSTEM</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="150" fill="url(#neotechGlow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="neotechGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>