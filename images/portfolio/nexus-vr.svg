<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- VR grid environment -->
  <g opacity="0.6">
    <!-- Horizon grid -->
    <g stroke="#00eeff" stroke-width="0.5" opacity="0.4">
      <!-- Horizontal lines with perspective -->
      <path d="M150,250 L450,250" />
      <path d="M125,275 L475,275" />
      <path d="M100,300 L500,300" />
      <path d="M75,325 L525,325" />
      <path d="M50,350 L550,350" />
      
      <!-- Vertical lines with perspective -->
      <path d="M150,250 L50,350" />
      <path d="M200,250 L125,350" />
      <path d="M250,250 L200,350" />
      <path d="M300,250 L300,350" />
      <path d="M350,250 L400,350" />
      <path d="M400,250 L475,350" />
      <path d="M450,250 L550,350" />
    </g>
    
    <!-- 3D objects in VR space -->
    <g>
      <!-- Floating cube -->
      <g transform="translate(200, 150)">
        <!-- Cube faces -->
        <path d="M-30,-30 L30,-30 L30,30 L-30,30 Z" fill="#9d4edd" opacity="0.7" />
        <path d="M30,-30 L50,-10 L50,50 L30,30 Z" fill="#9d4edd" opacity="0.5" />
        <path d="M-30,30 L30,30 L50,50 L-10,50 Z" fill="#9d4edd" opacity="0.3" />
      </g>
      
      <!-- Floating sphere -->
      <circle cx="400" cy="150" r="40" fill="none" stroke="#ff2a6d" stroke-width="2" opacity="0.7" />
      <circle cx="400" cy="150" r="30" fill="none" stroke="#ff2a6d" stroke-width="1" opacity="0.5" />
      <circle cx="400" cy="150" r="20" fill="none" stroke="#ff2a6d" stroke-width="1" opacity="0.3" />
      
      <!-- Floating pyramid -->
      <g transform="translate(300, 200)">
        <!-- Pyramid faces -->
        <path d="M0,-50 L40,30 L-40,30 Z" fill="#00eeff" opacity="0.7" />
        <path d="M0,-50 L40,30 L80,-20 Z" fill="#00eeff" opacity="0.5" />
        <path d="M0,-50 L-40,30 L-80,-20 Z" fill="#00eeff" opacity="0.3" />
      </g>
    </g>
  </g>
  
  <!-- VR headset outline -->
  <g transform="translate(300, 350)">
    <path d="M-60,-30 L60,-30 L70,-20 L70,20 L60,30 L-60,30 L-70,20 L-70,-20 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <rect x="-40" y="-20" width="80" height="40" rx="5" fill="#000000" opacity="0.8" />
    <path d="M-60,-10 L-80,0 L-60,10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <path d="M60,-10 L80,0 L60,10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
  </g>
  
  <!-- Nexus VR interface elements -->
  <g>
    <!-- Circular interface element -->
    <circle cx="300" cy="120" r="50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <circle cx="300" cy="120" r="45" fill="none" stroke="#00eeff" stroke-width="1" opacity="0.7" />
    
    <!-- Interface lines -->
    <line x1="260" y1="120" x2="340" y2="120" stroke="#ffffff" stroke-width="1" opacity="0.7" />
    <line x1="300" y1="80" x2="300" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.7" />
    
    <!-- Interface dots -->
    <circle cx="300" cy="120" r="5" fill="#ff2a6d" />
    <circle cx="320" cy="100" r="3" fill="#00eeff" />
    <circle cx="280" cy="100" r="3" fill="#00eeff" />
    <circle cx="320" cy="140" r="3" fill="#00eeff" />
    <circle cx="280" cy="140" r="3" fill="#00eeff" />
    
    <!-- Data points -->
    <g fill="#ffffff" opacity="0.8" font-family="'Courier New', monospace" font-size="8">
      <text x="350" y="100">NEXUS_NODE_01</text>
      <text x="350" y="115">IMMERSION: 94%</text>
      <text x="350" y="130">LATENCY: 12ms</text>
      <text x="350" y="145">USERS: 1,254</text>
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">NEXUS VR</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#00eeff" text-anchor="middle">IMMERSIVE VIRTUAL REALITY</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="180" fill="url(#vrGlow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="vrGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00eeff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>