<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Quantum particle system -->
  <g transform="translate(300, 200)">
    <!-- Orbital rings -->
    <ellipse cx="0" cy="0" rx="150" ry="60" fill="none" stroke="#9d4edd" stroke-width="1" opacity="0.3" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="none" stroke="#ff2a6d" stroke-width="1" opacity="0.4" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#00eeff" stroke-width="1" opacity="0.5" transform="rotate(90)" />
    
    <!-- Quantum particles -->
    <g>
      <!-- Particle cluster 1 -->
      <circle cx="-80" cy="-30" r="5" fill="#ff2a6d" opacity="0.9" />
      <circle cx="-75" cy="-25" r="3" fill="#ff2a6d" opacity="0.7" />
      <circle cx="-85" cy="-35" r="2" fill="#ff2a6d" opacity="0.5" />
      <circle cx="-90" cy="-20" r="1" fill="#ff2a6d" opacity="0.3" />
      
      <!-- Particle cluster 2 -->
      <circle cx="60" cy="40" r="5" fill="#00eeff" opacity="0.9" />
      <circle cx="65" cy="45" r="3" fill="#00eeff" opacity="0.7" />
      <circle cx="55" cy="35" r="2" fill="#00eeff" opacity="0.5" />
      <circle cx="70" cy="50" r="1" fill="#00eeff" opacity="0.3" />
      
      <!-- Particle cluster 3 -->
      <circle cx="20" cy="-60" r="5" fill="#9d4edd" opacity="0.9" />
      <circle cx="25" cy="-55" r="3" fill="#9d4edd" opacity="0.7" />
      <circle cx="15" cy="-65" r="2" fill="#9d4edd" opacity="0.5" />
      <circle cx="30" cy="-50" r="1" fill="#9d4edd" opacity="0.3" />
      
      <!-- Central nucleus -->
      <circle cx="0" cy="0" r="15" fill="url(#nucleusGradient)" />
    </g>
    
    <!-- Quantum connections -->
    <g stroke-width="1" opacity="0.6">
      <path d="M0,0 C-30,-10 -50,-20 -80,-30" stroke="#ff2a6d" fill="none" />
      <path d="M0,0 C20,15 40,30 60,40" stroke="#00eeff" fill="none" />
      <path d="M0,0 C5,-20 10,-40 20,-60" stroke="#9d4edd" fill="none" />
    </g>
    
    <!-- Energy waves -->
    <g opacity="0.3">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="1" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="1" />
      <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-width="1" />
    </g>
  </g>
  
  <!-- Brand elements -->
  <g transform="translate(450, 100)">
    <!-- Logo mark -->
    <g transform="scale(0.5)">
      <rect x="-20" y="-20" width="40" height="40" fill="#ff2a6d" />
      <circle cx="0" cy="0" r="15" fill="#121212" />
      <path d="M-10,-10 L10,10 M-10,10 L10,-10" stroke="#00eeff" stroke-width="2" />
    </g>
    
    <!-- Color palette -->
    <g transform="translate(0, 50)">
      <circle cx="-30" cy="0" r="10" fill="#ff2a6d" />
      <circle cx="0" cy="0" r="10" fill="#9d4edd" />
      <circle cx="30" cy="0" r="10" fill="#00eeff" />
    </g>
    
    <!-- Typography sample -->
    <g transform="translate(0, 80)" fill="#ffffff" font-family="'Arial', sans-serif" text-anchor="middle">
      <text x="0" y="0" font-size="10">QUANTUM</text>
      <text x="0" y="15" font-size="6">TYPOGRAPHY</text>
    </g>
  </g>
  
  <!-- Campaign elements -->
  <g transform="translate(150, 100)">
    <!-- Digital ad frame -->
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">DIGITAL</text>
    
    <!-- Print mockup -->
    <g transform="translate(0, 70)">
      <rect x="-40" y="-30" width="80" height="60" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" />
      <text x="0" y="0" font-family="'Arial', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">PRINT</text>
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">QUANTUM</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#ff2a6d" text-anchor="middle">BRAND CAMPAIGN</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="180" fill="url(#quantumGlow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="quantumGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="nucleusGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9d4edd;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff2a6d;stop-opacity:0.6" />
    </radialGradient>
  </defs>
</svg>