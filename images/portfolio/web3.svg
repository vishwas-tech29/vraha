<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with gradient -->
  <rect width="600" height="400" fill="#121212"/>
  
  <!-- Abstract blockchain/web3 elements -->
  <g opacity="0.8">
    <!-- Blockchain nodes and connections -->
    <g>
      <!-- Nodes -->
      <circle cx="150" cy="100" r="15" fill="#00eeff" opacity="0.8" />
      <circle cx="250" cy="150" r="15" fill="#9d4edd" opacity="0.8" />
      <circle cx="350" cy="100" r="15" fill="#ff2a6d" opacity="0.8" />
      <circle cx="450" cy="150" r="15" fill="#00eeff" opacity="0.8" />
      <circle cx="150" cy="200" r="15" fill="#ff2a6d" opacity="0.8" />
      <circle cx="250" cy="250" r="15" fill="#00eeff" opacity="0.8" />
      <circle cx="350" cy="200" r="15" fill="#9d4edd" opacity="0.8" />
      <circle cx="450" cy="250" r="15" fill="#ff2a6d" opacity="0.8" />
      <circle cx="150" cy="300" r="15" fill="#9d4edd" opacity="0.8" />
      <circle cx="250" cy="350" r="15" fill="#ff2a6d" opacity="0.8" />
      <circle cx="350" cy="300" r="15" fill="#00eeff" opacity="0.8" />
      <circle cx="450" cy="350" r="15" fill="#9d4edd" opacity="0.8" />
      
      <!-- Connections -->
      <g stroke-width="2" opacity="0.6">
        <line x1="150" y1="100" x2="250" y2="150" stroke="#00eeff" />
        <line x1="250" y1="150" x2="350" y2="100" stroke="#9d4edd" />
        <line x1="350" y1="100" x2="450" y2="150" stroke="#ff2a6d" />
        
        <line x1="150" y1="200" x2="250" y2="150" stroke="#ff2a6d" />
        <line x1="250" y1="150" x2="350" y2="200" stroke="#00eeff" />
        <line x1="350" y1="200" x2="450" y2="150" stroke="#9d4edd" />
        
        <line x1="150" y1="200" x2="250" y2="250" stroke="#9d4edd" />
        <line x1="250" y1="250" x2="350" y2="200" stroke="#ff2a6d" />
        <line x1="350" y1="200" x2="450" y2="250" stroke="#00eeff" />
        
        <line x1="150" y1="300" x2="250" y2="250" stroke="#00eeff" />
        <line x1="250" y1="250" x2="350" y2="300" stroke="#9d4edd" />
        <line x1="350" y1="300" x2="450" y2="250" stroke="#ff2a6d" />
        
        <line x1="150" y1="300" x2="250" y2="350" stroke="#ff2a6d" />
        <line x1="250" y1="350" x2="350" y2="300" stroke="#00eeff" />
        <line x1="350" y1="300" x2="450" y2="350" stroke="#9d4edd" />
      </g>
    </g>
    
    <!-- Animated data particles -->
    <g>
      <circle cx="200" cy="125" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="300" cy="125" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="400" cy="125" r="3" fill="#ffffff" opacity="0.9" />
      
      <circle cx="200" cy="175" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="300" cy="175" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="400" cy="175" r="3" fill="#ffffff" opacity="0.9" />
      
      <circle cx="200" cy="225" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="300" cy="225" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="400" cy="225" r="3" fill="#ffffff" opacity="0.9" />
      
      <circle cx="200" cy="275" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="300" cy="275" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="400" cy="275" r="3" fill="#ffffff" opacity="0.9" />
      
      <circle cx="200" cy="325" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="300" cy="325" r="3" fill="#ffffff" opacity="0.9" />
      <circle cx="400" cy="325" r="3" fill="#ffffff" opacity="0.9" />
    </g>
  </g>
  
  <!-- Web3 symbols -->
  <g>
    <!-- Ethereum-like symbol -->
    <g transform="translate(100, 150)">
      <path d="M0,0 L30,50 L60,0 L30,-50 Z" fill="none" stroke="#00eeff" stroke-width="2" />
      <line x1="30" y1="-50" x2="30" y2="50" stroke="#00eeff" stroke-width="2" />
    </g>
    
    <!-- NFT frame -->
    <g transform="translate(500, 150)">
      <rect x="-30" y="-40" width="60" height="80" fill="none" stroke="#ff2a6d" stroke-width="2" />
      <text x="0" y="10" font-family="'Arial', sans-serif" font-size="14" fill="#ff2a6d" text-anchor="middle">NFT</text>
    </g>
    
    <!-- Binary data visualization -->
    <g transform="translate(300, 350)" fill="#ffffff" opacity="0.7">
      <text x="-100" y="0" font-family="'Courier New', monospace" font-size="10">10110101</text>
      <text x="-50" y="0" font-family="'Courier New', monospace" font-size="10">01001010</text>
      <text x="0" y="0" font-family="'Courier New', monospace" font-size="10">11010010</text>
      <text x="50" y="0" font-family="'Courier New', monospace" font-size="10">01101001</text>
    </g>
  </g>
  
  <!-- Project Title -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">WEB3 EXPERIENCE</text>
    <text x="0" y="30" font-family="'Arial', sans-serif" font-size="14" fill="#00eeff" text-anchor="middle">BLOCKCHAIN & IMMERSIVE TECH</text>
  </g>
  
  <!-- Glowing effect overlay -->
  <circle cx="300" cy="200" r="180" fill="url(#web3Glow)" opacity="0.15" />
  
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="web3Glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00eeff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>