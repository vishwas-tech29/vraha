<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="50" fill="url(#avatarGradient3)"/>
  
  <!-- Abstract face elements -->
  <g>
    <!-- Head shape -->
    <circle cx="50" cy="45" r="25" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Abstract facial features -->
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
    <circle cx="60" cy="40" r="3" fill="#ffffff"/>
    
    <!-- Slight smile -->
    <path d="M40,55 Q50,60 60,55" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Abstract hair -->
    <path d="M30,30 Q50,20 70,30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <path d="M25,45 Q25,30 30,30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <path d="M75,45 Q75,30 70,30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.5">
    <circle cx="30" cy="80" r="5" fill="#ff2a6d"/>
    <circle cx="70" cy="80" r="5" fill="#00eeff"/>
    <circle cx="50" cy="70" r="5" fill="#9d4edd"/>
  </g>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="avatarGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121212"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>
</svg>