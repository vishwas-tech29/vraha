<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="50" fill="url(#avatarGradient)"/>
  
  <!-- Abstract face elements -->
  <g>
    <!-- Head shape -->
    <circle cx="50" cy="45" r="25" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Abstract facial features -->
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
    <circle cx="60" cy="40" r="3" fill="#ffffff"/>
    
    <!-- Smile -->
    <path d="M40,55 Q50,65 60,55" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Abstract hair -->
    <path d="M25,45 Q30,20 50,25 Q70,20 75,45" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.5">
    <circle cx="20" cy="70" r="5" fill="#00eeff"/>
    <circle cx="80" cy="70" r="5" fill="#9d4edd"/>
    <circle cx="50" cy="85" r="5" fill="#ff2a6d"/>
  </g>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121212"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>
</svg>