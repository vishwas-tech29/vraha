<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="50" fill="url(#avatarGradient2)"/>
  
  <!-- Abstract face elements -->
  <g>
    <!-- Head shape -->
    <circle cx="50" cy="45" r="25" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Abstract facial features -->
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
    <circle cx="60" cy="40" r="3" fill="#ffffff"/>
    
    <!-- Neutral expression -->
    <line x1="40" y1="55" x2="60" y2="55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Abstract hair/hat -->
    <path d="M25,35 Q50,15 75,35" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <path d="M25,35 L75,35" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.5">
    <circle cx="25" cy="75" r="5" fill="#9d4edd"/>
    <circle cx="75" cy="75" r="5" fill="#00eeff"/>
    <circle cx="50" cy="85" r="5" fill="#ff2a6d"/>
  </g>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="avatarGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121212"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>
</svg>